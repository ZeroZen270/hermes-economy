# Hermes economy config — copy to config.yaml and edit.
# Secrets come from the environment, never this file.

# --- survival economics ---
heartbeat_cost_credits: 50        # burned every tick, even if the agent idles
heartbeat_interval_seconds: 1500  # 25-min ticks; boost good shortens further
deep_rest_check_seconds: 21600    # how often to check for refill while in Deep Rest
agent_commission_pct: 30          # agent's cut of every gig; rest -> Aaron's treasury

# One-time owner grant adjustment: tops the agent's operating balance up to
# target_credits exactly once (recorded in the ledger meta table). Use when the
# cadence changes and the old grant no longer buys the intended runway.
# 15,000 credits = $15.00 ≈ 4 days of runway at 25-min ticks (72 x 50/day).
grant_adjustment:
  id: "cadence-25min-2026-09-24"
  target_credits: 15000
  memo: "owner grant adjustment for 25-min cadence"

# --- paths ---
data_dir: "./data"                # economy.db, inventory.json, logs live here
persona_path: "./persona/SOUL.md"
outbox_dir: "./data/outbox"       # heartbeat prompts land here

# --- agent invocation ---
# Shell command receiving the heartbeat prompt on stdin.
# Point at the real Hermes runner when it exists; empty = log prompt only.
agent_command: ""

# --- agent hands: ReAct tool-use loop ---
# Each affordable tick, the model may call tools (tools.py) for up to
# max_tool_rounds rounds before writing its report. Rounds x 4 calls max.
max_tool_rounds: 3

# --- review web UI ---
webui_port: 5000   # python3 webui.py --config config.yaml

# --- free brain: Google AI Studio (Gemini) free tier ---
# $0, no credit card — just a Google account. Get a key at
# https://aistudio.google.com/app/apikey and export it. Every affordable tick
# calls the model with the persona as system prompt and the survival state as
# the user message. Replies land in data/outbox/tick_NNNNNN.reply.md.
# Free-tier prompts may be used by Google to improve its models, so the prompt
# carries no secrets — only ledger balances and gig state.
llm:
  enabled: true
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  model: "gemini-3.6-flash"
  api_key_env: "GEMINI_API_KEY"
  timeout_seconds: 120
  max_tokens: 1024
  temperature: 0.7
  max_retries: 3              # extra attempts on 429 / 5xx (Gemini 503 spikes)
  retry_backoff_seconds: 5.0  # base; waits base * 2^attempt + jitter
  fallback_model: "gemini-flash-lite-latest"  # tried after primary exhausts retries
# export GEMINI_API_KEY=...
# Alternatives (same OpenAI-compatible shape):
#   Groq (free, no card): https://api.groq.com/openai/v1  -> GROQ_API_KEY
#   Nous portal (needs funded balance even for :free models) -> NOUS_PORTAL_API_KEY

# --- real money ---
stripe_enabled: true              # false = virtual ledger only, no Stripe calls
# export STRIPE_SECRET_KEY=sk_test_...   (start in TEST mode)
# export STRIPE_WEBHOOK_SECRET=whsec_... (only needed for the optional webhook)

# --- gig seeking ---
gig_seeker:
  min_bounty_usd: 5.0
  # Bounty boards. 'feed' works today with any public JSON/RSS URL.
  # '0xwork' needs their CLI installed + the exact list command from their docs.
  # 'clawtasks' stays disabled until you paste their verified API base — we refuse to guess.
  boards:
    - type: feed
      name: example-board
      url: https://example.com/bounties.json
    # - type: 0xwork
    #   list_command: "0xwork tasks list --json"
    # - type: clawtasks
    #   api_base: "https://..."   # from their docs
  # Seed domains for the prospector to audit (the agent can also add its own
  # discoveries at runtime via audit_leads()).
  prospect_domains: []
  # Sender identity for pitches — REQUIRED before any outreach (CAN-SPAM).
  sender:
    agent_name: "Hermes"
    operator_name: "Aaron"
    business_name: "Technology Squared LLC"
    reply_email: ""        # set before outreach
    postal_address: ""     # set before outreach
    base_price_usd: 25.0
