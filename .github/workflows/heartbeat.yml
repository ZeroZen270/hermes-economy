# Hermes survival heartbeat on GitHub's free tier.
#
# Each dispatcher-driven tick: restore state -> seek gigs -> run one heartbeat tick -> commit
# state back so the ledger survives between runs (runners are ephemeral).
#
# NOTE on cadence: a true every-25-minute schedule cannot be expressed in
# standard cron (25 does not divide 60) — `*/25` fires at :00/:25/:50, which
# is uneven. `*/30` is a true 30-minute cadence. It also keeps the account
# inside the free tier: 48 runs/day x ~1 min/run ~= 1,440 min/month, under
# the 2,000-minute free allowance for private repos.
#
# Setup: add GEMINI_API_KEY as a repo secret (Settings -> Secrets -> Actions).
# Stripe is retired; real-money payouts go by bank direct deposit, configured
# via PAYOUT_* env vars only on machines Aaron controls (never in the repo).
# The five PAYOUT_* values can also live as GitHub repo secrets — the tick
# step below passes them through, and payout_rails.py reports "not configured"
# (and does nothing) when any of them is absent.
# Manual trigger: Actions -> hermes-heartbeat -> Run workflow.
name: hermes-heartbeat

on:
  # Driven by external dispatcher (Muse cron `hermes-grind-dispatcher`), which
  # POSTs workflow_dispatch. GitHub's own `schedule` trigger never fired for
  # this repo, so it was removed to prevent double-ticks if it ever wakes up.
  workflow_dispatch:

concurrency:
  group: hermes-heartbeat
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the state commit can rebase+push

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"   # keeps each run near ~1 billed minute

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build config (Stripe retired; payouts via PAYOUT_* env on owned machines)
        run: |
          cp config.example.yaml config.yaml
          python3 - <<'EOF'
          import yaml
          p = "config.yaml"
          cfg = yaml.safe_load(open(p))
          cfg["stripe_enabled"] = False  # retired 2026-09-24; bank direct deposit instead
          yaml.safe_dump(cfg, open(p, "w"))
          print("stripe_enabled ->", cfg["stripe_enabled"])
          EOF

      - name: Seek gigs
        run: python3 gig_seeker/seek.py --config config.yaml

      - name: Heartbeat tick
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Payout rail passthrough. Missing secrets evaluate to empty
          # strings, and payout_rails.py treats that as "not configured"
          # (nothing payout-related executes). Only a masked summary
          # (bank + last 4) is ever displayed or logged.
          PAYOUT_BANK_NAME: ${{ secrets.PAYOUT_BANK_NAME }}
          PAYOUT_ACCOUNT_HOLDER: ${{ secrets.PAYOUT_ACCOUNT_HOLDER }}
          PAYOUT_ACCOUNT_TYPE: ${{ secrets.PAYOUT_ACCOUNT_TYPE }}
          PAYOUT_ROUTING: ${{ secrets.PAYOUT_ROUTING }}
          PAYOUT_ACCOUNT: ${{ secrets.PAYOUT_ACCOUNT }}
        run: python3 heartbeat.py --config config.yaml --once

      - name: Persist state
        if: always()
        run: |
          git config user.name "hermes-heartbeat"
          git config user.email "hermes-heartbeat@localhost"
          git add -f data/
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "heartbeat tick $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed; next tick retries"
          fi
